<!DOCTYPE html>
<html lang="es-UY">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<title>TOP CAR — OG image source (1200x630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background:
      radial-gradient(120% 120% at 90% 4%, rgba(214, 0, 45, 0.42), rgba(214, 0, 45, 0) 56%),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 60px),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 60px),
      linear-gradient(135deg, #14171b 0%, #0a0b0d 100%);
    color: #eef1f5;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 56px 72px 52px;
    position: relative;
  }

  /* --- fila superior --- */
  .top { display: flex; align-items: center; justify-content: space-between; height: 62px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand .wordmark {
    font-family: "Montserrat", sans-serif;
    font-weight: 900;
    font-size: 38px;
    letter-spacing: 5px;
  }
  .brand .accent {
    background: linear-gradient(135deg, #ff5c63, #d6002d 50%, #8b001f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .eyebrow {
    font-family: "Montserrat", sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #ff5c63;
    text-align: right;
  }

  /* --- bloque central (deja libre la columna derecha del disco) --- */
  .middle { padding-right: 310px; }
  h1 {
    font-family: "Montserrat", sans-serif;
    font-weight: 900;
    font-size: 72px;
    line-height: 1.06;
    letter-spacing: -0.03em;
    margin-bottom: 20px;
  }
  .sub {
    font-size: 26px;
    line-height: 1.4;
    color: #a3abb5;
    max-width: 700px;
  }

  /* --- disco decorativo, sangrado por el borde derecho --- */
  .disc {
    position: absolute;
    right: -110px;
    top: 50%;
    transform: translateY(-50%);
    filter: drop-shadow(0 30px 60px rgba(214, 0, 45, 0.35));
  }

  /* --- fila inferior --- */
  .bottom { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .pill {
    display: inline-flex;
    align-items: baseline;
    gap: 14px;
    padding: 17px 28px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff5c63, #d6002d 50%, #8b001f);
    font-family: "Montserrat", sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: #fff;
    box-shadow: 0 18px 44px rgba(214, 0, 45, 0.4);
    white-space: nowrap;
  }
  .pill small {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    opacity: 0.94;
  }
  .contact {
    text-align: right;
    font-size: 21px;
    font-weight: 600;
    line-height: 1.45;
    white-space: nowrap;
  }
  .contact .muted { color: #a3abb5; font-weight: 500; }
  .contact .stars { color: #ff5c63; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <svg width="62" height="62" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff5c63"/><stop offset="1" stop-color="#8b001f"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="17" fill="none" stroke="url(#g1)" stroke-width="4"/>
        <circle cx="32" cy="32" r="6" fill="url(#g1)"/>
        <g stroke="#f5f7fa" stroke-width="2.6" stroke-linecap="round">
          <path d="M32 15v6M32 43v6M15 32h6M43 32h6"/>
        </g>
      </svg>
      <span class="wordmark">TOP <span class="accent">CAR</span></span>
    </div>
    <div class="eyebrow">Taller mecánico · Rivera, Uruguay</div>
  </div>

  <div class="middle">
    <h1>Taller mecánico<br>en Rivera</h1>
    <p class="sub">Frenos, suspensión, inyección electrónica y diagnóstico computarizado.</p>
  </div>

  <svg class="disc" width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff5c63"/><stop offset="1" stop-color="#8b001f"/>
      </linearGradient>
    </defs>
    <circle cx="200" cy="200" r="168" fill="none" stroke="url(#g2)" stroke-width="12" opacity="0.5"/>
    <circle cx="200" cy="200" r="138" fill="none" stroke="url(#g2)" stroke-width="40"/>
    <circle cx="200" cy="200" r="96" fill="none" stroke="#f5f7fa" stroke-width="2" opacity="0.18"/>
    <circle cx="200" cy="200" r="56" fill="url(#g2)"/>
    <circle cx="200" cy="200" r="22" fill="#0a0b0d"/>
    <g stroke="#f5f7fa" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <path d="M200 62v26M200 312v26M62 200h26M312 200h26"/>
    </g>
  </svg>

  <div class="bottom">
    <div class="pill">AUXILIO 24 HS <small>Autos · Camionetas · Camiones pequeños</small></div>
    <div class="contact">
      Paysandú 255 · 098 738 689<br>
      <span class="muted">@topcar.rivera ·</span> <span class="stars">★ 4,4 en Google</span>
    </div>
  </div>
</body>
</html>
