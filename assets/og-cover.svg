<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="TOP CAR — Mecánica Automotriz en Rivera">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171b"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9247"/>
      <stop offset="1" stop-color="#ff3d00"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#ff5c1a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5c1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(90 250)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#accent)" stroke-width="14"/>
    <circle cx="0" cy="0" r="15" fill="url(#accent)"/>
  </g>

  <text x="160" y="272" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="6" fill="#eef1f5">TOP</text>
  <text x="300" y="272" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="6" fill="url(#accent)">CAR</text>

  <text x="92" y="350" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="66" font-weight="700" fill="#eef1f5">Mecánica Automotriz en Rivera</text>
  <text x="92" y="410" font-family="Inter,Arial,sans-serif" font-size="26" fill="#a3abb5">Frenos · Suspensión · Inyección electrónica · Diagnóstico computarizado</text>
  <text x="92" y="470" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" fill="#ff9247">J. P. Varela 1018 · 098 738 689 · @topcar.rivera</text>
</svg>
